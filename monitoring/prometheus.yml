# Compatibility reference only. Use deploy/compose.monitoring.yml and monitoring/prometheus/prometheus.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: vlx-node
    metrics_path: /ext/metrics
    static_configs:
      - targets: ["vlx-node:9650"]
  - job_name: vlx-probe
    static_configs:
      - targets: ["vlx-probe:9101"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
